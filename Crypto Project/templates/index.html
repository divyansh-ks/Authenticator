<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticator</title>
  <!-- html5-qrcode from CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0F172A;
      --surface:   #1E293B;
      --surface2:  #0F172A;
      --border:    rgba(148,163,184,.2);
      --border2:   rgba(148,163,184,.12);
      --text:      #E2E8F0;
      --muted:     #94A3B8;
      --dimmer:    #64748B;
      --indigo:    #6366F1;
      --indigo-lt: rgba(99,102,241,.15);
      --indigo-dk: #4F46E5;
      --emerald:   #10B981;
      --emerald-lt:rgba(16,185,129,.2);
      --amber:     #F59E0B;
      --amber-lt:  rgba(217,119,6,.18);
      --red:       #F87171;
      --radius:    1rem;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15,23,42,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: .75rem; }
    .logo-icon {
      width: 2.5rem; height: 2.5rem;
      background: var(--indigo);
      border-radius: .75rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(99,102,241,.35);
    }
    .logo-icon svg { width: 1.4rem; height: 1.4rem; color: #fff; }
    h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; color: #fff; }
    #btn-add {
      width: 2.5rem; height: 2.5rem;
      background: var(--surface); border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .2s;
      color: var(--text);
    }
    #btn-add:hover { background: #334155; }
    #btn-add svg { width: 1.4rem; height: 1.4rem; }

    /* ── Main Layout ── */
    main { max-width: 42rem; margin: 0 auto; padding: 1.5rem; }
    .section { margin-bottom: 1.5rem; }

    /* ── Warning Banner ── */
    /*.warning {
      background: var(--amber-lt);
      border: 1px solid rgba(245,158,11,.3);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex; gap: 1rem; align-items: flex-start;
    }
    .warning svg { width: 1.3rem; height: 1.3rem; color: var(--amber); flex-shrink: 0; margin-top: 2px; }
    .warning-title { font-weight: 600; color: var(--amber); font-size: .9rem; margin-bottom: .25rem; }
    .warning-body  { font-size: .82rem; color: rgba(253,230,138,.75); }*/

    /* ── Timer Bar ── */
    .timer-bar {
      background: rgba(30,41,59,.5);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .timer-left { display: flex; align-items: center; gap: .75rem; }
    .timer-left svg { width: 1.2rem; height: 1.2rem; color: var(--indigo); }
    .timer-label { font-size: .875rem; font-weight: 500; color: var(--muted); }
    .timer-right { display: flex; align-items: center; gap: 1rem; }
    #timer-count { font-size: 1.75rem; font-family: monospace; font-weight: 700; color: #fff; }
    .progress-wrap {
      width: 8rem; height: .5rem;
      background: #334155; border-radius: 9999px; overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      background: var(--indigo);
      border-radius: 9999px;
      transition: width 1s linear;
    }

    /* ── Empty State ── */
    #empty-state {
      text-align: center; padding: 5rem 0; color: var(--dimmer);
    }
    #empty-state svg { width: 4rem; height: 4rem; margin: 0 auto 1rem; opacity: .2; }
    #empty-state p { margin-bottom: .75rem; }
    #empty-link {
      color: var(--indigo); background: none; border: none;
      font-size: 1rem; font-weight: 500; cursor: pointer;
    }
    #empty-link:hover { color: #818CF8; }

    /* ── Account Cards ── */
    #accounts-list { display: flex; flex-direction: column; gap: 1rem; }
    .account-card {
      position: relative;
      background: rgba(30,41,59,.6);
      border: 1px solid var(--border2);
      border-radius: 1.25rem;
      padding: 1.25rem;
      transition: background .2s;
    }
    .account-card:hover { background: var(--surface); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .5rem; }
    .card-name  { font-weight: 600; font-size: 1.05rem; color: #fff; }
    .card-issuer{ font-size: .85rem; color: var(--muted); margin-top: .1rem; }
    .btn-delete {
      width: 2rem; height: 2rem;
      background: none; border: none; border-radius: .5rem;
      color: var(--dimmer); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s, color .2s, background .2s;
    }
    .account-card:hover .btn-delete { opacity: 1; }
    .btn-delete:hover { color: var(--red); background: rgba(248,113,113,.1); }
    .btn-delete svg { width: 1.1rem; height: 1.1rem; }

    .card-footer { display: flex; align-items: flex-end; justify-content: space-between; margin-top: .5rem; }
    .code-digits { display: flex; gap: .15rem; align-items: baseline; }
    .digit {
      font-size: 2.5rem; font-family: monospace; font-weight: 700;
      letter-spacing: -.04em; color: var(--indigo);
      transition: color .3s;
    }
    .digit.urgent { color: var(--red); animation: pulse 1s ease-in-out infinite; }
    .digit-space { margin-left: .4rem; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .45; }
    }

    .btn-copy {
      display: flex; align-items: center; gap: .4rem;
      padding: .5rem 1rem; border: none; border-radius: .75rem;
      font-size: .85rem; font-weight: 500; cursor: pointer;
      background: var(--indigo-lt); color: var(--indigo);
      transition: background .2s, color .2s;
    }
    .btn-copy:hover { background: rgba(99,102,241,.25); }
    .btn-copy.copied { background: var(--emerald-lt); color: var(--emerald); }
    .btn-copy svg { width: .95rem; height: .95rem; }

    /* ── Modal Overlay ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 50;
      align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    #modal-overlay.open { display: flex; }
    #modal-backdrop {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(6px);
    }
    .modal {
      position: relative; z-index: 1;
      width: 100%; max-width: 28rem;
      background: #0F172A;
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,.6);
      animation: popIn .2s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.92) translateY(16px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h2 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .btn-close {
      width: 2rem; height: 2rem; background: none; border: none;
      border-radius: 50%; color: var(--muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .btn-close:hover { background: var(--surface); }
    .btn-close svg { width: 1.1rem; height: 1.1rem; }
    .modal-body { padding: 1.5rem; }

    /* ── Method Picker ── */
    .method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .method-btn {
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
      padding: 1.5rem 1rem;
      background: rgba(30,41,59,.5); border: 1px solid var(--border2);
      border-radius: 1.25rem; cursor: pointer; transition: background .2s;
      color: var(--text);
    }
    .method-btn:hover { background: var(--surface); }
    .method-icon {
      width: 3rem; height: 3rem;
      background: var(--indigo-lt);
      border-radius: .75rem;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .method-btn:hover .method-icon { background: rgba(99,102,241,.25); }
    .method-icon svg { width: 1.4rem; height: 1.4rem; color: var(--indigo); }
    .method-label { font-weight: 500; font-size: .95rem; }

    /* ── Manual Form ── */
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block; font-size: .7rem; font-weight: 700;
      color: var(--dimmer); text-transform: uppercase; letter-spacing: .1em;
      margin-bottom: .5rem;
    }
    .form-input {
      width: 100%;
      background: var(--surface); border: 1px solid #334155;
      border-radius: .75rem; padding: .75rem 1rem;
      color: #fff; font-size: .95rem;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(99,102,241,.25);
    }
    .form-input.mono { font-family: monospace; }
    .form-actions { display: flex; gap: .75rem; margin-top: 1.25rem; }
    .btn-secondary {
      flex: 1; padding: .75rem;
      background: var(--surface); border: none; border-radius: .75rem;
      color: var(--muted); font-size: .95rem; font-weight: 500;
      cursor: pointer; transition: background .2s;
    }
    .btn-secondary:hover { background: #334155; }
    .btn-primary {
      flex: 1; padding: .75rem;
      background: var(--indigo); border: none; border-radius: .75rem;
      color: #fff; font-size: .95rem; font-weight: 500;
      cursor: pointer; transition: background .2s;
      box-shadow: 0 4px 12px rgba(99,102,241,.3);
    }
    .btn-primary:hover { background: var(--indigo-dk); }
    .error-msg { color: var(--red); font-size: .82rem; margin-top: .4rem; display: none; }

    /* ── QR Scanner ── */
    #reader {
      overflow: hidden; border-radius: 1rem;
      border: 1px solid var(--border); background: #000;
    }
    /* Override html5-qrcode default styles */
    #reader video { border-radius: .9rem !important; }
    #reader img[alt="Info icon"] { display: none !important; }
    .btn-cancel-qr {
      width: 100%; margin-top: 1rem;
      padding: .75rem; background: var(--surface);
      border: none; border-radius: .75rem;
      color: var(--muted); font-size: .95rem; font-weight: 500;
      cursor: pointer; transition: background .2s;
    }
    .btn-cancel-qr:hover { background: #334155; }

    /* ── Footer ── */
    footer {
      max-width: 42rem; margin: 0 auto;
      padding: 1.5rem; text-align: center;
      color: var(--dimmer); font-size: .75rem; line-height: 1.6;
    }

    /* ── Utility ── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────────── -->
<header>
  <div class="logo">
    <div class="logo-icon">
      <!-- Shield icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<!-- ── Main ─────────────────────────────────────────────────── -->
<main>

  <!-- Security Warning -->

      <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>

  <!-- Timer Bar -->

  <div id="modal-backdrop"></div>
  <div class="modal">
    <div class="modal-header">
      <h2>Add Account</h2>

<script>
/* ══════════════════════════════════════════════════
   State
══════════════════════════════════════════════════ */
let accounts = JSON.parse(localStorage.getItem('totp_accounts') || '[]');
let codes     = {};           // { id: "123456" }
let copiedId  = null;
let copyTimer = null;
let pollTimer = null;
let scanner   = null;

/* ══════════════════════════════════════════════════
   Persist helpers
══════════════════════════════════════════════════ */
function saveAccounts() {
  localStorage.setItem('totp_accounts', JSON.stringify(accounts));
}

/* ══════════════════════════════════════════════════
   TOTP API calls
══════════════════════════════════════════════════ */
async function fetchCodes() {
  if (!accounts.length) { codes = {}; return; }
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accounts: accounts.map(a => ({ id: a.id, secret: a.secret })) })
    });
    const data = await res.json();
    codes = data.codes || {};
  } catch (e) {
    console.error('fetchCodes error', e);
  }
}

async function validateSecret(secret) {
  const res = await fetch('/api/validate_secret', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ secret })
  });
  return res.ok;
}

/* ══════════════════════════════════════════════════
   Timer & polling
══════════════════════════════════════════════════ */
let lastWindow = -1;

function startTimer() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const now     = Math.floor(Date.now() / 1000);
    const window  = Math.floor(now / 30);
    const remain  = 30 - (now % 30);

    // Update UI
    document.getElementById('timer-count').textContent = remain + 's';
    document.getElementById('progress-fill').style.width = ((remain / 30) * 100) + '%';

    // Rotate spin icon briefly on rollover
    if (window !== lastWindow) {
      lastWindow = window;
      await fetchCodes();
      renderCodes();   // just update digits, not full re-render
    }

    // Tint digits red when urgent
    document.querySelectorAll('.digit').forEach(el => {
      el.classList.toggle('urgent', remain < 5);
    });
  }, 1000);
}

/* ══════════════════════════════════════════════════
   Rendering
══════════════════════════════════════════════════ */
function renderAll() {
  const list  = document.getElementById('accounts-list');
  const empty = document.getElementById('empty-state');

  if (!accounts.length) {
    list.innerHTML  = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  list.innerHTML = accounts.map(card).join('');
  attachCardListeners();
}

function card(acc) {
  const code   = codes[acc.id] || '------';
  const digits = code.split('').map((d, i) =>
    `<span class="digit${i === 3 ? ' digit-space' : ''}">${d}</span>`
  ).join('');

  const wasCopied = copiedId === acc.id;
  const copyBtn = wasCopied
    ? `<button class="btn-copy copied" data-id="${acc.id}">
         ${checkIcon()} Copied
       </button>`
    : `<button class="btn-copy" data-id="${acc.id}">
         ${copyIcon()} Copy
       </button>`;

  return `
  <div class="account-card" data-id="${acc.id}">
    <div class="card-header">
      <div>
        <div class="card-name">${esc(acc.name)}</div>
        ${acc.issuer ? `<div class="card-issuer">${esc(acc.issuer)}</div>` : ''}
      </div>
      <button class="btn-delete" data-id="${acc.id}" title="Delete">
        ${trashIcon()}
      </button>
    </div>
    <div class="card-footer">
      <div class="code-digits">${digits}</div>
      ${copyBtn}
    </div>
  </div>`;
}

function renderCodes() {
  // Only update digits & copy buttons without rebuilding entire DOM
  accounts.forEach(acc => {
    const cardEl = document.querySelector(`.account-card[data-id="${acc.id}"]`);
    if (!cardEl) return;
    const code   = codes[acc.id] || '------';
    const digits = cardEl.querySelector('.code-digits');
    if (digits) {
      digits.innerHTML = code.split('').map((d, i) =>
        `<span class="digit${i === 3 ? ' digit-space' : ''}">${d}</span>`
      ).join('');
    }
  });
}

function attachCardListeners() {
  document.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      if (confirm('Are you sure you want to delete this account?')) {
        accounts = accounts.filter(a => a.id !== btn.dataset.id);
        saveAccounts();
        fetchCodes().then(renderAll);
      }
    });
  });
  document.querySelectorAll('.btn-copy').forEach(btn => {
    btn.addEventListener('click', () => {
      const id   = btn.dataset.id;
      const code = codes[id];
      if (!code || code === 'ERROR') return;
      navigator.clipboard.writeText(code).then(() => {
        clearTimeout(copyTimer);
        copiedId = id;
        renderAll();
        copyTimer = setTimeout(() => { copiedId = null; renderAll(); }, 2000);
      });
    });
  });
}

/* ══════════════════════════════════════════════════
   Modal helpers
══════════════════════════════════════════════════ */
function openModal()  { document.getElementById('modal-overlay').classList.add('open'); showPicker(); }
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  stopScanner();
  showPicker();
  clearForm();
}

function showPicker() {
  document.getElementById('method-picker').classList.remove('hidden');
  document.getElementById('manual-form').classList.add('hidden');
  document.getElementById('qr-section').classList.add('hidden');
}
function showManual() {
  document.getElementById('method-picker').classList.add('hidden');
  document.getElementById('manual-form').classList.remove('hidden');
  setTimeout(() => document.getElementById('input-name').focus(), 50);
}
function showQR() {
  document.getElementById('method-picker').classList.add('hidden');
  document.getElementById('qr-section').classList.remove('hidden');
}
function clearForm() {
  document.getElementById('input-name').value   = '';
  document.getElementById('input-secret').value = '';
  document.getElementById('secret-error').style.display = 'none';
}

/* ══════════════════════════════════════════════════
   QR Scanner
══════════════════════════════════════════════════ */
function startScanner() {
  showQR();
  setTimeout(() => {
    scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 240, height: 240 } }, false);
    scanner.render(onScanSuccess, () => {});
  }, 100);
}

function stopScanner() {
  if (scanner) {
    scanner.clear().catch(() => {});
    scanner = null;
  }
}

function onScanSuccess(text) {
  try {
    // Parse otpauth:// URI manually
    const url    = new URL(text);
    if (url.protocol !== 'otpauth:') throw new Error('Not otpauth URI');
    const params  = url.searchParams;
    const secret  = params.get('secret');
    if (!secret) throw new Error('No secret');
    const label   = decodeURIComponent(url.pathname.replace(/^\/\/totp\//, '').replace(/^\//, ''));
    const issuer  = params.get('issuer') || '';

    const newAcc = {
      id:     crypto.randomUUID(),
      name:   label || 'Unknown',
      issuer,
      secret: secret.toUpperCase()
    };
    accounts.push(newAcc);
    saveAccounts();
    stopScanner();
    closeModal();
    fetchCodes().then(renderAll);
  } catch (e) {
    alert('Invalid OTP QR code. Please try again.');
  }
}

/* ══════════════════════════════════════════════════
   Manual add
══════════════════════════════════════════════════ */
async function handleManualAdd() {
  const name   = document.getElementById('input-name').value.trim();
  const secret = document.getElementById('input-secret').value.trim().replace(/\s/g, '').toUpperCase();
  const errEl  = document.getElementById('secret-error');

  if (!name || !secret) return;

  errEl.style.display = 'none';
  const ok = await validateSecret(secret);
  if (!ok) {
    errEl.style.display = 'block';
    return;
  }

  accounts.push({ id: crypto.randomUUID(), name, secret });
  saveAccounts();
  closeModal();
  fetchCodes().then(renderAll);
}

/* ══════════════════════════════════════════════════
   SVG helpers
══════════════════════════════════════════════════ */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function trashIcon()  { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`; }
function copyIcon()   { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`; }
function checkIcon()  { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`; }

/* ══════════════════════════════════════════════════
   Event Listeners
══════════════════════════════════════════════════ */
document.getElementById('btn-add').addEventListener('click', openModal);
document.getElementById('empty-link').addEventListener('click', openModal);
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal-backdrop').addEventListener('click', closeModal);

document.getElementById('pick-qr').addEventListener('click', startScanner);
document.getElementById('pick-manual').addEventListener('click', showManual);

document.getElementById('manual-back').addEventListener('click', () => { clearForm(); showPicker(); });
document.getElementById('manual-submit').addEventListener('click', handleManualAdd);
document.getElementById('input-secret').addEventListener('keydown', e => { if (e.key === 'Enter') handleManualAdd(); });
document.getElementById('input-name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('input-secret').focus(); });

document.getElementById('qr-cancel').addEventListener('click', () => { stopScanner(); showPicker(); });

/* ══════════════════════════════════════════════════
   Boot
══════════════════════════════════════════════════ */
(async () => {
  await fetchCodes();
  renderAll();
  startTimer();
})();
</script>
